name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ghost-patterns-v2
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ghost-patterns-v2/pyproject.toml
      - name: Install
        run: pip install -e ".[app,dev]"
      - name: Test
        run: pytest -q
      - name: CLI smoke test
        run: ghostpatterns --version
