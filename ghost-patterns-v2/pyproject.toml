[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostpatterns"
dynamic = ["version"]
description = "Tell real patterns from ghosts: data-mining results calibrated against structureless noise."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["data mining", "association rules", "clustering", "anomaly detection",
            "null models", "permutation test", "false discovery rate"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
app = ["streamlit>=1.50"]
dev = ["pytest>=7.0"]

[project.scripts]
ghostpatterns = "ghostpatterns.cli:main"

[tool.setuptools]
packages = ["ghostpatterns"]

[tool.setuptools.dynamic]
version = { attr = "ghostpatterns.__version__" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
